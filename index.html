<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badge Test PWA</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  body { font-family: -apple-system, sans-serif; padding: 20px; }
  button { display: block; width: 100%; padding: 14px; margin: 8px 0; font-size: 16px; }
  #badgeMenuToggle { display: flex; justify-content: space-between; align-items: center; background: #eee; }
  #badgeMenuToggle .arrow { transition: transform 0.2s; }
  #badgeMenuToggle[aria-expanded="true"] .arrow { transform: rotate(90deg); }
  #badgeSection { padding-left: 12px; border-left: 3px solid #eee; margin-bottom: 12px; }
  #log { background: #f2f2f2; padding: 10px; margin-top: 20px; white-space: pre-wrap; font-size: 13px; border-radius: 6px; }
  .day-tabs { display: flex; gap: 6px; margin: 8px 0; }
  .day-tabs button { flex: 1; margin: 0; padding: 10px 4px; font-size: 14px; background: #eee; border: none; border-radius: 6px; }
  .day-tabs button.active { background: #4F46E5; color: #fff; }
  .schedule-list { list-style: none; padding: 0; margin: 0 0 16px; }
  .schedule-list li { display: flex; gap: 12px; padding: 10px 4px; border-bottom: 1px solid #eee; }
  .schedule-list time { flex: 0 0 56px; font-weight: bold; color: #4F46E5; }
</style>
</head>
<body>
  <h2>World Youth Day</h2>

  <button id="badgeMenuToggle" aria-expanded="false">PWA Badge 테스트 <span class="arrow">▸</span></button>
  <div id="badgeSection" hidden>
    <h3>① API 지원 여부 확인</h3>
    <button id="checkSupport">setAppBadge 지원 확인</button>

    <h3>② 배지 직접 테스트 (서버 없이)</h3>
    <button id="setBadge5">배지 5로 설정</button>
    <button id="setBadgeDot">배지 점(dot)만 표시</button>
    <button id="clearBadge">배지 지우기</button>

    <h3>③ 알림 권한 + 푸시 구독 (서버 연동용)</h3>
    <button id="requestPermission">알림 권한 요청</button>
    <button id="subscribePush">Push 구독하기</button>
  </div>

  <h3>앱 연동</h3>
  <button id="openRealtalk">리얼톡(무전) 기능 사용하기</button>

  <h3>시간표</h3>
  <div class="day-tabs" id="dayTabs"></div>
  <ul class="schedule-list" id="scheduleList"></ul>

  <h3>부가 기능</h3>
  <button id="notice">공지사항</button>
  <button id="locationCheck">위치확인</button>
  <button id="sosCall" style="background:#dc2626;color:#fff;">구조/구급신고(전화)</button>
  <button id="sos" style="background:#dc2626;color:#fff;">구조/구급신고(SMS)</button>

  <div id="log">로그가 여기에 표시됩니다.</div>

<script>
const log = (msg) => {
  const el = document.getElementById('log');
  el.textContent = new Date().toLocaleTimeString() + ' - ' + msg + '\n' + el.textContent;
};

// 시간표 더미 데이터 (세계청소년대회 컨셉)
const scheduleData = [
  {
    day: '8/1 (목)',
    items: [
      { time: '09:00', title: '등록 및 환영' },
      { time: '10:30', title: '개회미사' },
      { time: '14:00', title: '카테케시스 (교리교육)' },
      { time: '16:00', title: '소그룹 나눔' },
      { time: '19:00', title: '환영 문화공연' }
    ]
  },
  {
    day: '8/2 (금)',
    items: [
      { time: '08:00', title: '아침기도' },
      { time: '09:30', title: '카테케시스' },
      { time: '13:00', title: '도보 성지순례' },
      { time: '18:00', title: '청년 콘서트' },
      { time: '21:00', title: '성체조배' }
    ]
  },
  {
    day: '8/3 (토)',
    items: [
      { time: '07:00', title: '아침미사' },
      { time: '10:00', title: '자유시간 / 지역 탐방' },
      { time: '15:00', title: '십자가의 길' },
      { time: '20:00', title: '철야기도 (Vigil)' }
    ]
  },
  {
    day: '8/4 (일)',
    items: [
      { time: '07:00', title: '기상 및 아침식사' },
      { time: '09:00', title: '폐회미사' },
      { time: '12:00', title: '파견식 및 해산' }
    ]
  }
];

function renderSchedule(dayIndex) {
  const list = document.getElementById('scheduleList');
  list.innerHTML = scheduleData[dayIndex].items
    .map(item => `<li><time>${item.time}</time><span>${item.title}</span></li>`)
    .join('');

  document.querySelectorAll('#dayTabs button').forEach((btn, i) => {
    btn.classList.toggle('active', i === dayIndex);
  });
}

const dayTabs = document.getElementById('dayTabs');
scheduleData.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.textContent = d.day;
  btn.onclick = () => renderSchedule(i);
  dayTabs.appendChild(btn);
});
renderSchedule(0);

// PWA Badge 테스트 소항목 토글
document.getElementById('badgeMenuToggle').onclick = (e) => {
  const section = document.getElementById('badgeSection');
  const expanded = !section.hidden;
  section.hidden = expanded;
  e.currentTarget.setAttribute('aria-expanded', String(!expanded));
};

// 서비스워커 등록
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => log('서비스워커 등록 완료'))
    .catch(err => log('서비스워커 등록 실패: ' + err));
}

// ① 지원 여부 확인
document.getElementById('checkSupport').onclick = () => {
  const supported = 'setAppBadge' in navigator;
  log('setAppBadge 지원: ' + supported + (supported ? '' : ' (iOS는 홈화면 설치 + 16.4 이상 필요)'));
};

// ② 서버 없이 즉시 테스트
document.getElementById('setBadge5').onclick = () => {
  navigator.setAppBadge(5)
    .then(() => log('배지 5 설정 성공'))
    .catch(err => log('실패: ' + err + ' (알림 권한 필요할 수 있음)'));
};

document.getElementById('setBadgeDot').onclick = () => {
  navigator.setAppBadge()
    .then(() => log('배지 dot 설정 성공'))
    .catch(err => log('실패: ' + err));
};

document.getElementById('clearBadge').onclick = () => {
  navigator.clearAppBadge()
    .then(() => log('배지 초기화 성공'))
    .catch(err => log('실패: ' + err));
};

// ③ 알림 권한 요청
document.getElementById('requestPermission').onclick = async () => {
  const result = await Notification.requestPermission();
  log('알림 권한 결과: ' + result);
};

// ③ Push 구독 (실제 서버 발송 테스트용)
// ⚠️ 아래 VAPID_PUBLIC_KEY는 server.js에서 생성한 값으로 교체해야 함
const VAPID_PUBLIC_KEY = 'YOUR_VAPID_PUBLIC_KEY_HERE';

function urlBase64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}

document.getElementById('subscribePush').onclick = async () => {
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    log('Push 구독 성공: ' + JSON.stringify(sub));

    // 서버로 구독 정보 전송
    await fetch('/subscribe', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(sub)
    });
    log('구독 정보 서버 전송 완료');
  } catch (err) {
    log('Push 구독 실패: ' + err);
  }
};

// ④ 네이티브 앱(realtalk)으로 메시지 전달
// TSZWebEntryViewController.swift가 WKUserContentController에 name: "nativeBridge"로
// 핸들러를 등록해두고, message.body.action === "OPEN_REALTALK"을 받으면
// 화면 전환을 수행함
document.getElementById('openRealtalk').onclick = () => {
  const bridge = window.webkit
    && window.webkit.messageHandlers
    && window.webkit.messageHandlers.nativeBridge;

  if (!bridge) {
    log('네이티브 브릿지 없음: realtalk 앱 웹뷰 안에서만 동작합니다.');
    return;
  }

  bridge.postMessage({ action: 'OPEN_REALTALK' });
  log('네이티브로 OPEN_REALTALK 메시지 전송');
};

// ⑤ 부가 기능 (자리만 마련된 버튼, 동작 미구현)
document.getElementById('notice').onclick = () => {
  log('공지사항 버튼 클릭됨 (기능 미구현)');
};

document.getElementById('locationCheck').onclick = () => {
  log('위치확인 버튼 클릭됨 (기능 미구현)');
};

// 구조/구급신고(전화): 119로 바로 전화 연결
document.getElementById('sosCall').onclick = () => {
  log('119로 전화를 겁니다.');
  window.location.href = 'tel:119';
};

// 구조/구급신고(SMS): 현재 위치를 담아 119로 보낼 SMS 작성 화면을 연다.
// iOS는 웹/앱에서 SMS를 자동 발송하는 것을 허용하지 않으므로,
// 메시지 앱을 미리 채워서 열어주고 실제 전송은 사용자가 직접 눌러야 한다.
function sendSosSms(coords) {
  let body = '[긴급 구조/구급 신고] 도움이 필요합니다.';

  if (coords) {
    const lat = coords.latitude.toFixed(6);
    const lng = coords.longitude.toFixed(6);
    const mapsUrl = `https://maps.google.com/?q=${lat},${lng}`;
    body += ` 현재 위치: 위도 ${lat}, 경도 ${lng} (${mapsUrl})`;
  } else {
    body += ' (위치 정보를 가져올 수 없어 위치는 포함되지 않았습니다)';
  }

  const smsLink = `sms:119&body=${encodeURIComponent(body)}`;
  log('메시지 앱으로 이동합니다. 내용 확인 후 직접 전송 버튼을 눌러주세요.');
  window.location.href = smsLink;
}

document.getElementById('sos').onclick = () => {
  if (!('geolocation' in navigator)) {
    log('이 브라우저는 위치 정보를 지원하지 않습니다. 위치 없이 신고를 진행합니다.');
    sendSosSms(null);
    return;
  }

  log('현재 위치를 확인하는 중...');
  navigator.geolocation.getCurrentPosition(
    (pos) => sendSosSms(pos.coords),
    (err) => {
      log('위치 정보를 가져오지 못했습니다: ' + err.message);
      sendSosSms(null);
    },
    { enableHighAccuracy: true, timeout: 8000 }
  );
};
</script>
</body>
</html>
